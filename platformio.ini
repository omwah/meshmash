; MeshMash build environments.
;
;   pixi run sim     host simulator (headless, scripted)  -> .pio/build/sim/program
;                    (sim_tdeck: the same at the T-Deck's 320x240)
;   pixi run test    host unit tests
;   pixi run build   Cardputer ADV firmware (BLE default, USB-only small build)

[platformio]
src_dir = src
boards_dir = .deps/meshcore/boards   ; t-deck.json
default_envs = sim
extra_configs = platformio.local.ini

[common]
; The label shown on the device comes from git (scripts/version.py); this is used without git.
version_fallback = 1.3.0
build_flags =
  -std=gnu++17
  -I src
ui_src =
  +<ui/>
  +<gen/>

; Unicode coverage per board, see scripts/unicode_profiles.py. MC_UNICODE in the
; environment overrides it (MC_UNICODE=none for Spleen only, std,+math, ...).
[env:sim]
platform = native
custom_unicode = min
extra_scripts = pre:scripts/pio_pre.py
build_flags = ${common.build_flags}
  -D MC_UI_REMOTE=1
  -I boards/sim
  -I boards/common/keymap
  -I boards/cardputer_adv/keymap
  -O1 -g -Wall -Wno-unused-function
  -fsanitize=address,undefined
build_unflags = -std=gnu++11 -std=gnu++14
build_src_filter = ${common.ui_src}
  +<../boards/sim/>
  +<../boards/cardputer_adv/keymap/*.c>
test_build_src = yes

; The simulator at the T-Deck's screen size.
[env:sim_tdeck]
extends = env:sim
custom_unicode = std
build_flags = ${common.build_flags}
  -D MC_UI_REMOTE=1
  -D MC_BOARD_TDECK
  -D MC_LONG_PATH
  -D MC_TOUCH=1
  -D MC_SCREEN_W=320
  -D MC_SCREEN_H=240
  -I boards/sim
  -I boards/common/keymap
  -I boards/tdeck/keymap
  -O1 -g -Wall -Wno-unused-function
  -fsanitize=address,undefined
build_src_filter = ${common.ui_src}
  +<../boards/sim/>
  +<../boards/tdeck/keymap/*.c>

; Unit tests: same sources as the simulator, separate build dir so running
; tests never replaces the simulator binary.
[env:test]
extends = env:sim
; test_backup, test_companion, test_ping_bot need src/app and the MeshCore host shim: they run under env:simnet_test
test_ignore =
  test_backup
  test_companion
  test_ping_bot
  test_tdeck

; The T-Deck keymap and trackball, built as sim_tdeck is.
[env:test_tdeck]
extends = env:sim_tdeck
test_filter = test_tdeck

; Real MeshCore (patched submodule) on the host: several companion nodes on a
; simulated LoRa medium with a virtual clock, driving the real UI.
[meshcore_host]
build_flags =
  -D RP2040_PLATFORM   ; MeshCore's plain-fs::FS storage path (host shim)
  -D MESHCORE_HOST_SIM
  -include stdint.h     ; some Arduino libraries expect it to come with Arduino.h
  -D MAX_CONTACTS=150
  -D MAX_GROUP_CHANNELS=8
  -D OFFLINE_QUEUE_SIZE=32
  -D ENABLE_PRIVATE_KEY_IMPORT=1 -D ENABLE_PRIVATE_KEY_EXPORT=1   ; as the device builds
  -D LORA_FREQ=910.525 -D LORA_BW=62.5 -D LORA_SF=7 -D LORA_CR=5
  -I boards/simnet
  -I boards/simnet/arduino
  -I .deps/meshcore/src
  -I .deps/meshcore/lib/ed25519
  -I .deps/meshcore/examples/companion_radio
meshcore_src =
  +<../.deps/meshcore/src/*.cpp>
  +<../.deps/meshcore/lib/ed25519/*.c>
  +<../.deps/meshcore/src/helpers/BaseChatMesh.cpp>
  +<../.deps/meshcore/src/helpers/AdvertDataHelpers.cpp>
  +<../.deps/meshcore/src/helpers/TxtDataHelpers.cpp>
  +<../.deps/meshcore/src/helpers/IdentityStore.cpp>
  +<../.deps/meshcore/src/helpers/ConfigSerializer.cpp>
  +<../.deps/meshcore/src/helpers/CommonRadioPrefs.cpp>
  +<../.deps/meshcore/src/helpers/DynamicConfigSerializer.cpp>
  +<../.deps/meshcore/src/helpers/TransportKeyStore.cpp>
  +<../.deps/meshcore/src/helpers/RegionMap.cpp>
  +<../.deps/meshcore/src/helpers/StaticPoolPacketManager.cpp>
  +<../.deps/meshcore/examples/companion_radio/MyMesh.cpp>
  +<../.deps/meshcore/examples/companion_radio/DataStore.cpp>

[env:simnet]
custom_unicode = min
platform = native
extra_scripts = pre:scripts/pio_pre.py
lib_deps =
  rweather/Crypto @ ^0.4.0
  electroniccats/CayenneLPP @ 1.6.1
  densaugeo/base64 @ ~1.4.0
lib_compat_mode = off
build_flags = ${common.build_flags}
  ${meshcore_host.build_flags}
  -D MC_UI_REMOTE=1
  -I boards/sim
  -I boards/common/keymap
  -I boards/cardputer_adv/keymap
  -O1 -g -Wall -Wno-unused-function -Wno-unused-variable -Wno-sign-compare
  -fsanitize=address,undefined
  -fno-sanitize=shift   ; ed25519 ref10 shifts negative values by design
  -D MSG_RING_RECORDS=40   ; a small ring, so scenarios reach the SD archive
build_unflags = -std=gnu++11 -std=gnu++14
build_src_filter = ${common.ui_src}
  ${meshcore_host.meshcore_src}
  +<app/>
  +<../boards/simnet/>
  +<../boards/sim/sim_keyboard.cpp>
  +<../boards/sim/runner.cpp>
  +<../boards/cardputer_adv/keymap/*.c>

; Unit tests that need the MeshCore host shim; separate build dir so tests
; never replace the simnet program.
[env:simnet_test]
extends = env:simnet
build_flags = ${env:simnet.build_flags} -D MC_HISTORY_ON_SD -D MC_LONG_PATH
test_filter =
  test_backup
  test_companion
  test_ping_bot
test_build_src = yes

; ----------------------------------------------------------------- device
; M5Stack Cardputer ADV (ESP32-S3FN8, 8 MB flash, no PSRAM) + Cap LoRa-1262.
; MeshCore is compiled from the patched tree (.deps/meshcore) with the same
; library pins and RadioLib exclusions as upstream's [arduino_base].
[cardputer_adv_base]
custom_unicode = min
platform = platformio/espressif32@6.11.0
board = m5stack-stamps3
framework = arduino
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = pre:scripts/pio_pre.py
build_unflags = -std=gnu++11 -std=gnu++14
build_flags = ${common.build_flags}
  -Os
  -w
  -I boards/cardputer_adv
  -I boards/common/esp32
  -I boards/common/keymap
  -I boards/cardputer_adv/keymap
  -I .deps/meshcore/src
  -I .deps/meshcore/lib/ed25519
  -I .deps/meshcore/examples/companion_radio
  -D NDEBUG
  -D ESP32_PLATFORM
  -Wl,--wrap=sscanf -Wl,--wrap=siscanf   ; boards/common/esp32/libc_trim.cpp: no newlib scanf
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D CORE_DEBUG_LEVEL=0
  -D RADIOLIB_STATIC_ONLY=1
  -D RADIOLIB_GODMODE=1
  -D RADIOLIB_EXCLUDE_CC1101=1 -D RADIOLIB_EXCLUDE_RF69=1 -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1 -D RADIOLIB_EXCLUDE_RFM2X=1 -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1 -D RADIOLIB_EXCLUDE_AX25=1 -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1 -D RADIOLIB_EXCLUDE_APRS=1 -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1 -D RADIOLIB_EXCLUDE_SSTV=1
  ; mesh (as stock MeshCore builds: private key import/export for the apps)
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  -D MAX_CONTACTS=150
  -D MAX_GROUP_CHANNELS=8
  -D OFFLINE_QUEUE_SIZE=32
  -D LORA_FREQ=910.525 -D LORA_BW=62.5 -D LORA_SF=7 -D LORA_CR=5   ; "USA" preset
  -D LORA_TX_POWER=22
  ; Cap LoRa-1262 (SX1262): NSS 5, IRQ 4, RST 3, BUSY 6 on SCK 40 / MISO 39 / MOSI 14
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_NSS=5 -D P_LORA_DIO_1=4 -D P_LORA_RESET=3 -D P_LORA_BUSY=6
  -D P_LORA_SCLK=40 -D P_LORA_MISO=39 -D P_LORA_MOSI=14
  -D SX126X_DIO3_TCXO_VOLTAGE=3.3
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  ; GPS (ATGM336H): module TX -> GPIO15, module RX <- GPIO13, 115200 8N1
  -D ENV_INCLUDE_GPS=1
  -D PIN_GPS_TX=15 -D PIN_GPS_RX=13 -D GPS_BAUD_RATE=115200
  ; board: internal I2C (keyboard, IO expander), battery, SD, display
  -D PIN_BOARD_SDA=8 -D PIN_BOARD_SCL=9
  -D PIN_VBAT_READ=10
  -D PIN_KBD_INT=11
  -D PIN_SD_CS=12
  -D PIN_TFT_SCL=36 -D PIN_TFT_SDA=35 -D PIN_TFT_CS=37 -D PIN_TFT_DC=34 -D PIN_TFT_RST=33 -D PIN_TFT_BL=38
  ; CPU clock: MeshCore's ESP32Board::begin applies ESP32_CPU_FREQ if set. 240 MHz
  ; by default; try -D ESP32_CPU_FREQ=80 (or 160) to save power (see DEVICE-TESTING.md).
lib_deps =
  SPI
  Wire
  SD
  https://github.com/jgromes/RadioLib.git#6d8934836678d8894e3d556550475b37dce3e2b6
  rweather/Crypto @ ^0.4.0
  adafruit/RTClib @ ^2.1.3
  melopero/Melopero RV3028 @ ^1.1.0
  electroniccats/CayenneLPP @ 1.6.1
  densaugeo/base64 @ ~1.4.0
  stevemarple/MicroNMEA @ ^2.0.6
build_src_filter = ${common.ui_src}
  +<app/>
  +<../boards/common/esp32/>
  +<../boards/cardputer_adv/>
  +<../.deps/meshcore/src/*.cpp>
  +<../.deps/meshcore/lib/ed25519/*.c>
  +<../.deps/meshcore/src/helpers/AdvertDataHelpers.cpp>
  +<../.deps/meshcore/src/helpers/AutoDiscoverRTCClock.cpp>
  +<../.deps/meshcore/src/helpers/RTC_RX8130CE.cpp>
  +<../.deps/meshcore/src/helpers/BaseChatMesh.cpp>
  +<../.deps/meshcore/src/helpers/ConfigSerializer.cpp>
  +<../.deps/meshcore/src/helpers/CommonRadioPrefs.cpp>
  +<../.deps/meshcore/src/helpers/DynamicConfigSerializer.cpp>
  +<../.deps/meshcore/src/helpers/ESP32Board.cpp>
  +<../.deps/meshcore/src/helpers/IdentityStore.cpp>
  +<../.deps/meshcore/src/helpers/RegionMap.cpp>
  +<../.deps/meshcore/src/helpers/StaticPoolPacketManager.cpp>
  +<../.deps/meshcore/src/helpers/TransportKeyStore.cpp>
  +<../.deps/meshcore/src/helpers/TxtDataHelpers.cpp>
  +<../.deps/meshcore/src/helpers/radiolib/*.cpp>
  +<../.deps/meshcore/src/helpers/sensors/EnvironmentSensorManager.cpp>
  +<../.deps/meshcore/examples/companion_radio/MyMesh.cpp>
  +<../.deps/meshcore/examples/companion_radio/DataStore.cpp>

; Default: the UI plus MeshCore's Bluetooth companion (phone apps), over NimBLE
; (boards/common/esp32/nimble_serial.*) rather than stock's Bluedroid.
[env:cardputer_adv]
extends = cardputer_adv_base
build_flags = ${cardputer_adv_base.build_flags}
  -D BLE_PIN_CODE=123456
  -D BLE_NAME_PREFIX=\"MeshCore-\"
  -D MC_UI_REMOTE=1   ; remote node mode (Bluetooth client)
lib_deps = ${cardputer_adv_base.lib_deps}
  h2zero/NimBLE-Arduino @ 1.4.3
lib_ignore = BLE

; Smaller: no Bluetooth (saves ~230 KB flash and its heap); USB companion only.
[env:cardputer_adv_usb]
extends = cardputer_adv_base
build_flags = ${cardputer_adv_base.build_flags}
  -D ENABLE_USB_INTERFACE
build_src_filter = ${cardputer_adv_base.build_src_filter}
  +<../.deps/meshcore/src/helpers/ArduinoSerialInterface.cpp>

; LilyGo T-Deck Plus: ESP32-S3 (16 MB flash, 8 MB PSRAM), 320x240 touch
; screen, keyboard and trackball, SX1262, GPS. Everything else as the
; Cardputer's build.
[tdeck_base]
extends = cardputer_adv_base
custom_unicode = std
board = t-deck
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
build_flags = ${common.build_flags}
  -Os
  -w
  -I boards/tdeck
  -I boards/common/esp32
  -I boards/common/keymap
  -I boards/tdeck/keymap
  -I .deps/meshcore/src
  -I .deps/meshcore/lib/ed25519
  -I .deps/meshcore/examples/companion_radio
  -D NDEBUG
  -D ESP32_PLATFORM
  -D MSG_RING_RECORDS=256   ; the newest 256 messages (~53 KB); older ones live on the SD card
  -D MC_HISTORY_ON_SD       ; with a card the history lives on it, not in the flash
  -D MC_LONG_PATH           ; a message keeps its whole route (up to 32 bytes), records are 241 bytes
  -D BOARD_HAS_PSRAM
  -Wl,--wrap=sscanf -Wl,--wrap=siscanf   ; boards/common/esp32/libc_trim.cpp: no newlib scanf
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D CORE_DEBUG_LEVEL=0
  -D RADIOLIB_STATIC_ONLY=1
  -D RADIOLIB_GODMODE=1
  -D RADIOLIB_EXCLUDE_CC1101=1 -D RADIOLIB_EXCLUDE_RF69=1 -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1 -D RADIOLIB_EXCLUDE_RFM2X=1 -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1 -D RADIOLIB_EXCLUDE_AX25=1 -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1 -D RADIOLIB_EXCLUDE_APRS=1 -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1 -D RADIOLIB_EXCLUDE_SSTV=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  ; more room than the Cardputer (MeshCore's own T-Deck build keeps 350);
  ; channels stop at 16, the UI's mute mask
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=16
  -D MC_LIST_MAX=400
  -D OFFLINE_QUEUE_SIZE=64
  -D LORA_FREQ=910.525 -D LORA_BW=62.5 -D LORA_SF=7 -D LORA_CR=5   ; "USA" preset
  -D LORA_TX_POWER=22
  ; the UI
  -D MC_BOARD_TDECK
  -D MC_TOUCH=1
  -D MC_SCREEN_W=320 -D MC_SCREEN_H=240
  ; SX1262: NSS 9, IRQ 45, RST 17, BUSY 13 on SCK 40 / MISO 38 / MOSI 41 (shared)
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_NSS=9 -D P_LORA_DIO_1=45 -D P_LORA_RESET=17 -D P_LORA_BUSY=13
  -D P_LORA_SCLK=40 -D P_LORA_MISO=38 -D P_LORA_MOSI=41
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8f
  -D SX126X_DIO2_AS_RF_SWITCH=false
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  ; GPS (Plus): module TX -> GPIO44, module RX <- GPIO43; MeshCore's T-Deck rate
  -D ENV_INCLUDE_GPS=1
  -D PIN_GPS_TX=44 -D PIN_GPS_RX=43 -D GPS_BAUD_RATE=38400
  ; board: peripheral power, I2C (keyboard 0x55, touch), battery, SD, display,
  ; trackball, speaker
  -D PIN_PERF_POWERON=10
  -D PIN_BOARD_SDA=18 -D PIN_BOARD_SCL=8
  -D PIN_VBAT_READ=4
  -D PIN_TOUCH_INT=16
  -D PIN_SD_CS=39
  -D PIN_TFT_CS=12 -D PIN_TFT_DC=11 -D PIN_TFT_BL=42
  -D PIN_BALL_UP=3 -D PIN_BALL_DOWN=15 -D PIN_BALL_LEFT=1 -D PIN_BALL_RIGHT=2 -D PIN_BALL_CLICK=0
  -D PIN_I2S_BCK=7 -D PIN_I2S_WS=5 -D PIN_I2S_DOUT=6
build_src_filter = ${common.ui_src}
  +<app/>
  +<../boards/common/esp32/>
  +<../boards/tdeck/>
  +<../.deps/meshcore/src/*.cpp>
  +<../.deps/meshcore/lib/ed25519/*.c>
  +<../.deps/meshcore/src/helpers/AdvertDataHelpers.cpp>
  +<../.deps/meshcore/src/helpers/AutoDiscoverRTCClock.cpp>
  +<../.deps/meshcore/src/helpers/RTC_RX8130CE.cpp>
  +<../.deps/meshcore/src/helpers/BaseChatMesh.cpp>
  +<../.deps/meshcore/src/helpers/ConfigSerializer.cpp>
  +<../.deps/meshcore/src/helpers/CommonRadioPrefs.cpp>
  +<../.deps/meshcore/src/helpers/DynamicConfigSerializer.cpp>
  +<../.deps/meshcore/src/helpers/ESP32Board.cpp>
  +<../.deps/meshcore/src/helpers/IdentityStore.cpp>
  +<../.deps/meshcore/src/helpers/RegionMap.cpp>
  +<../.deps/meshcore/src/helpers/StaticPoolPacketManager.cpp>
  +<../.deps/meshcore/src/helpers/TransportKeyStore.cpp>
  +<../.deps/meshcore/src/helpers/TxtDataHelpers.cpp>
  +<../.deps/meshcore/src/helpers/radiolib/*.cpp>
  +<../.deps/meshcore/src/helpers/sensors/EnvironmentSensorManager.cpp>
  +<../.deps/meshcore/examples/companion_radio/MyMesh.cpp>
  +<../.deps/meshcore/examples/companion_radio/DataStore.cpp>

; Default: Bluetooth companion over NimBLE, and remote node mode.
[env:tdeck]
extends = tdeck_base
build_flags = ${tdeck_base.build_flags}
  -D BLE_PIN_CODE=123456
  -D BLE_NAME_PREFIX=\"MeshCore-\"
  -D MC_UI_REMOTE=1
lib_deps = ${tdeck_base.lib_deps}
  h2zero/NimBLE-Arduino @ 1.4.3
lib_ignore = BLE

; USB companion only.
[env:tdeck_usb]
extends = tdeck_base
build_flags = ${tdeck_base.build_flags}
  -D ENABLE_USB_INTERFACE
build_src_filter = ${tdeck_base.build_src_filter}
  +<../.deps/meshcore/src/helpers/ArduinoSerialInterface.cpp>
