# Build the firmware images and publish them as a GitHub release when a
# version tag (1.2.0, 1.3.0-rc1, ...) is pushed.
#
# Each board gets two images (see scripts/package.py):
#   meshmash-<ver>-<env>.bin        application only: OTA and Launcher's WebUI install
#   meshmash-<ver>-<env>-full.bin   bootloader + partitions + app: M5Burner, web
#                                   flashers, esptool, and Launcher from the SD card
name: release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Tag matches firmware version
        run: |
          ver="$(sed -n 's/.*MC_UI_VERSION=\\"\([^"\\]*\)\\".*/\1/p' platformio.ini | head -n1)"
          if [ "$ver" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match MC_UI_VERSION $ver in platformio.ini"
            exit 1
          fi

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          locked: true
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build
        run: pixi run build

      - name: Size budgets
        run: pixi run size

      - name: Package
        run: pixi run package

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/"$GITHUB_REF_NAME"/* \
            --title "MeshMash $GITHUB_REF_NAME" --generate-notes "${flags[@]}"
