# Host-side toolchain for MeshMash. Firmware dependencies come from
# PlatformIO (pinned in platformio.ini) and the MeshCore submodule.
#
#   pixi install         # materialise .pixi/envs/default
#   pixi run <task>      # see `pixi task list`

[workspace]
authors = ["MeshMash contributors"]
license = "MIT"
license-file = "LICENSE"
channels = ["conda-forge"]
name = "meshmash"
platforms = ["linux-64"]
version = "1.2.0"

[dependencies]
python = "3.13.*"
platformio = ">=6.1"
pillow = ">=11"
sdl2 = ">=2.30"
pkg-config = "*"
fonttools = ">=4.67.0,<5"

[tasks]
deps     = "scripts/prepare-deps.sh"
fonts    = "python -I scripts/gen_fonts.py"
icons    = "python -I scripts/gen_icons.py"
sim      = { cmd = "pio run -e sim -e sim_tdeck", depends-on = ["deps"] }
test     = { cmd = "pio test -e test -e test_tdeck -e simnet_test", depends-on = ["deps"] }
simnet   = { cmd = "pio run -e simnet", depends-on = ["deps"] }
simnet-test = { cmd = "python -I scripts/simnet_tests.py", depends-on = ["simnet"] }
shots    = { cmd = "python -I scripts/screenshots.py", depends-on = ["sim"] }
build    = { cmd = "pio run -e cardputer_adv -e cardputer_adv_usb -e tdeck -e tdeck_usb", depends-on = ["deps"] }
size     = { cmd = "python -I scripts/check-size.py", depends-on = ["build"] }
package  = { cmd = "python -I scripts/package.py", depends-on = ["build"] }
launcher-install = { cmd = "python -I scripts/launcher-install.py", description = "Build only the chosen board, package and install it over Launcher's WebUI: pixi run launcher-install IP --variant cardputer|tdeck [--usb] [--replace] [--boot] [--upload [FOLDER]]" }
pii      = "scripts/pii-check.sh --all"
licenses = "python -I scripts/check-licenses.py"
contrast = "python -I scripts/check-contrast.py"
ci       = "scripts/ci-local.sh"
upstream = "scripts/check-upstream-main.sh"
